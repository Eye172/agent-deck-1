<svg xmlns="http://www.w3.org/2000/svg" width="132" height="102" viewBox="0 0 132 102"><title>Three small connected AI agents</title><desc>A matte yellow coordinator above a brick-red researcher and a leaf-green builder, joined by thin connections.</desc><path class="team-wire" d="M66 37v10H31v18M66 47h35v18M45 78h42" fill="none" stroke="#8f9e86" stroke-width="1.35" stroke-linejoin="round"/><circle cx="66" cy="47" r="2" fill="#aeba9e"/><g transform="translate(50 8)" data-agent="coordinator"><path d="M10 3h12v4h5v5h3v12h-4v5H6v-5H2V12h3V7h5Z M8 13h5v5H8Z M19 13h5v5h-5Z M15 3h2v6h-2Z" fill="#d8b957" fill-rule="evenodd"/></g><g transform="translate(15 62)" data-agent="researcher"><path d="M10 3h12v4h5v5h3v12h-4v5H6v-5H2V12h3V7h5Z M8 13h5v5H8Z M19 13h5v5h-5Z M15 3h2v6h-2Z" fill="#ce7d6d" fill-rule="evenodd"/></g><g transform="translate(85 62)" data-agent="builder"><path d="M10 3h12v4h5v5h3v12h-4v5H6v-5H2V12h3V7h5Z M8 13h5v5H8Z M19 13h5v5h-5Z M15 3h2v6h-2Z" fill="#92b276" fill-rule="evenodd"/></g></svg>
